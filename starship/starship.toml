add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$character"

[character]
error_symbol = "[✗](bold #bd3f3b)"
success_symbol = "[❯](bold #34c3ff)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold #34c3ff"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #46b9f4"

[git_status]
format = '[$all_status]($style)'
style = "#34c3ff"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
