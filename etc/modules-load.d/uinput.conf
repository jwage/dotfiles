# Load uinput at boot so magicmouse-scroll can create its virtual touchpad.
#
# uinput is a module here, not built into the kernel, and nothing pulls it in
# on its own. It cannot be autoloaded on demand either: module autoloading
# keys off a device or a modalias, and what magicmouse-scroll does is *open*
# /dev/uinput -- opening a character device whose driver is not registered
# fails outright rather than triggering a load.
#
# The symptom when this is missing is confusing, because a /dev/uinput node
# can be sitting right there while the driver behind it is absent:
#
#   $ ls -l /dev/uinput
#   crw------- 1 root root 10, 223 /dev/uinput
#   $ udevadm info --name=/dev/uinput
#   Unknown device "/dev/uinput": No such device
#
# That also defeats 99-uinput.rules, which is what should be granting the
# input group access. udev applies GROUP/MODE when it processes the device's
# uevent, and with the module unloaded there is no device and no uevent -- so
# the node keeps root:root 0600 and magicmouse-scroll dies on
# "/dev/uinput" cannot be opened for writing. Loading the module is what makes
# the rule fire; the rule alone cannot fix it.
uinput
