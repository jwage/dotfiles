; Omarchy/Arch only. shell/env.sh adds php/linux to PHP_INI_SCAN_DIR on
; Linux; macOS never loads this file.
;
; Arch ships these as commented stubs in php.ini / conf.d. Enable them
; here for interactive CLI instead of editing /etc/php. Leave the system
; stubs commented so they are not double-loaded.
; igbinary must precede redis. sysvsem is Symfony Lock SemaphoreStore
; (StrategySubscriptionMessageHandler unit tests).
extension=gd
extension=gmp
extension=pgsql
extension=pdo_pgsql
extension=sockets
extension=sodium
extension=apcu
extension=igbinary
extension=redis
extension=sysvsem
