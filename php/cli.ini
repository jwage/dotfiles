; PHP CLI-only overrides, loaded via PHP_INI_SCAN_DIR (see shell/env.sh).
; Not the system php.ini: this only applies to php invoked from an
; interactive shell, never to php-fpm/Apache workers.
;
; Shared across macOS and Omarchy. OS-specific extension= lines do NOT
; belong here (Homebrew PHP already enables gd/pgsql/etc.; re-declaring
; them fatals with "already loaded"). See php/linux/ and php/README.md.

; phpunit/composer/etc. on a large codebase shouldn't hit a web-request-sized
; default (128M); CLI scripts aren't served to untrusted users, so unbounded
; is the standard convention here.
memory_limit = -1
