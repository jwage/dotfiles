# Deliberately empty: shadows Omarchy's /usr/lib/environment.d/10-omarchy-fcitx.conf.
#
# systemd reads environment.d files from ~/.config, /etc, /run and /usr/lib in
# increasing priority, and a file that shares a name with a lower-priority one
# replaces it outright rather than merging. So this file, by existing under the
# same name, drops the QT_IM_MODULE / XMODIFIERS / SDL_IM_MODULE=fcitx that
# Omarchy sets.
#
# Those exist to route input through fcitx5, whose only job here was turning
# ~/.XCompose sequences into text. That was never used -- the sequences were
# generated by Omarchy's installer, not written -- so the XCompose file, the
# fcitx5 service and these variables are all gone together. Leaving the
# variables behind would point Qt apps at an input method that is not running.
